plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.beseennative'
version = '1.0.0'

android {
  namespace "expo.modules.beseennative"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.work:work-runtime-ktx:2.10.1"
  implementation "androidx.core:core-ktx:1.13.1"
}
